# GoReleaser builds and publishes the kong-mesh-v3-preflight binary to GitHub Releases on
# every `v*` tag. Consumers (kuma / kong-mesh nightly CI) download the linux asset
# from the release instead of building from source.
#
# Local dry run: `goreleaser release --snapshot --clean`
version: 2

project_name: kong-mesh-v3-preflight

builds:
  - id: kong-mesh-v3-preflight
    main: ./cmd/kong-mesh-v3-preflight
    binary: kong-mesh-v3-preflight
    env:
      - CGO_ENABLED=0 # stdlib-only; static binary
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

# Archive name template is the contract the CI download step relies on:
#   kong-mesh-v3-preflight_<os>_<arch>.tar.gz  (each contains the `kong-mesh-v3-preflight` binary)
archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  prerelease: auto
