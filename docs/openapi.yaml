openapi: 3.1.0
info:
  title: kuma3-preflight report schema
  version: "1.0.0"
  description: |
    Schema for the JSON documents emitted by the `kuma3-preflight` CLI
    (`github.com/Kong/kong-mesh-v3-readiness`, `cmd/kuma3-preflight`).

    `kuma3-preflight` is a CLI, not an HTTP service — this document has no `paths`.
    It exists only so the two JSON contracts below can be browsed/validated with
    standard OpenAPI/JSON-Schema tooling (Redoc, openapi-generator, ajv). Point such
    tooling at a real file — `--output report.json`, or `--classify ... --format json
    --output classification.json` — and validate it against the matching schema.

    Two independent, versioned contracts are shipped:
    - `Report` — the CP-audit report (default command; `schema` = `kuma3-preflight/vN`).
    - `Classification` — the `--classify` output (`schema` = `kuma3-preflight-classification/v1`).
    Each is a stable contract: `--from-json` reloads `Report` verbatim, so JSON,
    HTML (and, for classification, Markdown) render from the exact same object.

    Generated from the `preflight` and `reportmodel` Go packages by
    `tools/openapigen` — do not edit by hand; run `go generate ./...` from the
    repo root after changing a contract type.
  license:
    name: Apache-2.0
externalDocs:
  description: Repository README and architecture notes
  url: https://github.com/Kong/kong-mesh-v3-readiness
paths: {}

components:
  schemas:
    ClassSummary:
      additionalProperties: false
      description: ClassSummary is the headline counts shown above a classification report.
      properties:
        deprecatedUsages:
          minimum: 0
          type: integer
        features:
          minimum: 0
          type: integer
        globalMigrations:
          minimum: 0
          type: integer
        remove:
          minimum: 0
          type: integer
        rewrite:
          minimum: 0
          type: integer
      required:
      - features
      - remove
      - rewrite
      - deprecatedUsages
      - globalMigrations
      type: object
    Classification:
      additionalProperties: false
      description: Classification is the canonical, serializable form of a --classify
        run.
      properties:
        features:
          items:
            $ref: '#/components/schemas/Feature'
          type: array
        generatedAt:
          format: date-time
          type: string
        global:
          description: |-
            Global lifts non-removable deprecations recurring across enough suites into
            one cross-cutting fix, out of each Feature's Usages.
          items:
            $ref: '#/components/schemas/GlobalMigration'
          type: array
        reportsDir:
          type: string
        schema:
          enum:
          - kuma3-preflight-classification/v1
          type: string
        sourceDir:
          type: string
        summary:
          $ref: '#/components/schemas/ClassSummary'
        tool:
          enum:
          - kuma3-preflight
          type: string
      required:
      - schema
      - tool
      - summary
      - global
      - features
      type: object
    ControlPlane:
      additionalProperties: false
      description: ControlPlane identifies the audited control plane.
      properties:
        mode:
          enum:
          - ""
          - standalone
          - zone
          - global
          type: string
        product:
          type: string
        version:
          type: string
      required:
      - product
      - version
      type: object
    CoverageGap:
      additionalProperties: false
      description: CoverageGap records a collection that could not be audited — a 404
        or a transport error — so the report distinguishes "absent" from "not observed".
      properties:
        path:
          type: string
        reason:
          type: string
      required:
      - path
      - reason
      type: object
    ExampleResource:
      additionalProperties: false
      description: ExampleResource identifies one example behind a finding.
      properties:
        kri:
          description: |-
            KRI is the canonical 3.0 identifier
            kri_<short>_<mesh>_<zone>_<namespace>_<name>_<section>; empty when the
            type has no 3.0 short name (removed or not registered by 3.0).
          type: string
        mesh:
          description: |-
            Mesh is the mesh the resource (or the example) belongs to; empty for
            control-plane-wide examples.
          type: string
        name:
          description: |-
            Name is the resource display name, the one that survives a KDS
            hash-suffix; empty for non-resource examples.
          type: string
        namespace:
          description: |-
            Namespace is the k8s.kuma.io/namespace the resource carries; empty on
            Universal and for global-origin resources.
          type: string
        note:
          description: |-
            Note is the free text of a non-resource example, or an annotation
            accompanying a resource one (the Mesh field it flagged, a version).
          type: string
        system:
          description: |-
            System marks CP-managed (kuma.io/policy-role: system) resources, whose
            defaults the operator must update before 3.0.
          type: boolean
        type:
          description: |-
            Type is the Kuma resource type, e.g. "MeshTimeout"; empty for
            non-resource examples.
          type: string
        zone:
          description: |-
            Zone is the kuma.io/zone the resource carries — set on a global CP for
            resources synced from a zone, and on per-zone control-plane findings.
          type: string
      type: object
    Feature:
      additionalProperties: false
      description: Feature is one e2e suite's deprecation classification.
      properties:
        name:
          type: string
        recommendation:
          enum:
          - REMOVE/REPLACE
          - REWRITE
          type: string
        usages:
          items:
            $ref: '#/components/schemas/Usage'
          type: array
      required:
      - name
      - recommendation
      - usages
      type: object
    Finding:
      additionalProperties: false
      description: Finding is one (severity, category, title) grouped occurrence in the
        report.
      properties:
        category:
          type: string
        count:
          minimum: 1
          type: integer
        detail:
          type: string
        doc_url:
          description: |-
            Doc links to the Kong Mesh page explaining the 3.0 replacement API/feature.
            Optional: omitted for findings with no replacement to point at.
          format: uri
          type: string
        example_resources:
          items:
            $ref: '#/components/schemas/ExampleResource'
          maxItems: 10
          type: array
        group:
          enum:
          - upgrade_path
          - control_plane
          - mesh_object
          - policies
          - removed_resources
          - data_plane_and_workloads
          - other
          type: string
        severity:
          description: Severity "warning" stays in the enum; no current check emits one.
          enum:
          - blocker
          - warning
          - info
          type: string
        title:
          type: string
      required:
      - severity
      - group
      - category
      - title
      - detail
      - count
      - example_resources
      type: object
    GlobalMigration:
      additionalProperties: false
      description: 'GlobalMigration is a cross-cutting deprecation: a non-removable field/policy/
        mesh setting recurring across many suites, fixed once centrally rather than per
        suite.'
      properties:
        category:
          type: string
        count:
          minimum: 0
          type: integer
        kind:
          type: string
        removable:
          description: Removable is always false here — removed resources stay per-suite
            removal work.
          type: boolean
        replacement:
          type: string
        suites:
          minimum: 3
          type: integer
      required:
      - kind
      - category
      - replacement
      - removable
      - suites
      - count
      type: object
    ManualCheck:
      additionalProperties: false
      description: ManualCheck is one upgrade item the CP API cannot surface, rendered
        as a card in the manual checklist.
      properties:
        command:
          type: string
        detail:
          type: string
        title:
          type: string
      required:
      - title
      type: object
    Report:
      additionalProperties: false
      description: Report is the canonical, serializable form of a CP-audit report.
      properties:
        address:
          type: string
        control_plane:
          $ref: '#/components/schemas/ControlPlane'
        coverage_gaps:
          description: Coverage gaps make the run inconclusive, never clean.
          items:
            $ref: '#/components/schemas/CoverageGap'
          type: array
        error:
          description: Error never echoes a raw HTTP response body or bearer token.
          type: string
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
        generated_at:
          format: date-time
          type: string
        manual_checks:
          items:
            $ref: '#/components/schemas/ManualCheck'
          type: array
        meshes:
          items:
            type: string
          type: array
        status:
          description: |-
            Status reflects report trustworthiness first: an incomplete audit is
            inconclusive even when it still found blockers elsewhere.
          enum:
          - clean
          - blockers
          - inconclusive
          - failed
          type: string
        summary:
          $ref: '#/components/schemas/Summary'
        tool:
          enum:
          - kuma3-preflight
          type: string
        tool_schema:
          description: Schema is "kuma3-preflight/vN"; ParseReport accepts the current
            vN only.
          pattern: ^kuma3-preflight/v[0-9]+$
          type: string
      required:
      - tool_schema
      - tool
      - status
      - control_plane
      - meshes
      - summary
      - findings
      - coverage_gaps
      - manual_checks
      type: object
    Summary:
      additionalProperties: false
      description: Summary tallies findings by severity plus coverage/parse-error counts.
      properties:
        blockers:
          minimum: 0
          type: integer
        coverage_gaps:
          minimum: 0
          type: integer
        info:
          minimum: 0
          type: integer
        parse_errors:
          minimum: 0
          type: integer
        system_findings:
          minimum: 0
          type: integer
        warnings:
          description: Warnings stays in the emitted contract; no check emits one.
          minimum: 0
          type: integer
      required:
      - blockers
      - warnings
      - info
      - coverage_gaps
      - parse_errors
      - system_findings
      type: object
    Usage:
      additionalProperties: false
      description: Usage is one deprecated-feature usage within a Feature.
      properties:
        category:
          type: string
        count:
          minimum: 0
          type: integer
        examples:
          items:
            type: string
          type: array
        global:
          description: |-
            Global marks a usage whose Kind was lifted into Classification.Global; the
            per-suite view omits these to avoid repeating the same fix in every suite.
          type: boolean
        kind:
          type: string
        removable:
          type: boolean
        replacement:
          type: string
        sources:
          items:
            type: string
          type: array
      required:
      - kind
      - category
      - replacement
      - removable
      - count
      - sources
      - examples
      type: object
